<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptography Toolkit - Hash</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Feature 3: Hash Functions</h2>
        
        <label for="inputText">Nhập chuỗi văn bản (Plaintext):</label>
        <textarea id="inputText" rows="4" placeholder="Nhập văn bản cần băm vào đây..."></textarea>

        <label for="algoSelect">Chọn thuật toán:</label>
        <select id="algoSelect">
            <option value="SHA-256">SHA-256</option>
            <option value="MD5">MD5</option>
        </select>

        <button onclick="generateHash()">Tính toán Hash</button>

        <div id="resultArea">
            <div class="result-title">Kết quả (Digest):</div>
            <div id="resultText" class="digest-text"></div>
            
            <div class="action-buttons">
                <button class="btn-copy" onclick="copyResult()">Copy Result</button>
                <button class="btn-retry" onclick="tryAgain()">Try Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
