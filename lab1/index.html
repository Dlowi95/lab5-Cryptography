<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cryptography Toolkit</title>
<link rel="stylesheet" href="style.css">

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js"></script>
</head>

<body>

<div class="container">
  <h1>🔐 Cryptography Toolkit</h1>

  <select id="feature">
    <option value="sym">Symmetric</option>
    <option value="rsa">RSA</option>
    <option value="hash">Hash</option>
  </select>

  <select id="algo">
    <option value="aes">AES</option>
    <option value="des">DES</option>
    <option value="tripledes">3DES</option>
    <option value="md5">MD5</option>
    <option value="sha256">SHA-256</option>
  </select>

  <textarea id="input" placeholder="Enter text"></textarea>

  <input id="key" placeholder="Enter key (optional)">

  <div class="buttons">
    <button onclick="generateKey()">Generate Key</button>
    <button onclick="encrypt()">Encrypt</button>
    <button onclick="decrypt()">Decrypt</button>
    <button onclick="hash()">Hash</button>
    <button onclick="genRSA()">Generate RSA Key</button>
    <button onclick="rsaEncrypt()">RSA Encrypt</button>
    <button onclick="rsaDecrypt()">RSA Decrypt</button>
  </div>

  <div id="output"></div>
</div>

<script src="app.js"></script>

</body>
</html>
