<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AES Encryption Tool</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

<div class="container">
  <h1>🔐 AES Encryption Tool</h1>

  <textarea id="input" placeholder="Enter text (Plaintext or Ciphertext)"></textarea>

  <input id="key" placeholder="Enter secret key">

  <div class="buttons">
    <button onclick="generateKey()">Generate Random Key</button>
    <button onclick="encrypt()">Encrypt</button>
    <button onclick="decrypt()">Decrypt</button>
  </div>

  <!-- Nơi hiển thị kết quả -->
  <div id="output">Output will appear here...</div>
</div>

<script src="app.js"></script>

</body>
</html>
